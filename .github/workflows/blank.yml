# This is a basic workflow to help you get started with Actions

name: Quickshell CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
    
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout Code
        uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Dependency installation
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git base-devel cmake extra-cmake-modules qt6-base qt6-declarative
          
          pacman -S --noconfirm jemalloc qt6-svg libpipewire cpptrace polkit \
          vulkan-headers qt6-shadertools wayland-protocols cli11 ninja

          # 3. Create a brand new unprivileged user specifically for the compilation step
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          chown -R builder:builder /tmp
          
          sudo -u builder git clone https://aur.archlinux.org/quickshell-git.git /tmp/quickshell
          cd /tmp/quickshell 
          sudo -u builder makepkg -si --noconfirm --asdeps
      # Runs a set of commands using the runners shell
      - name: Check QML Syntax
        run: |
          quickshell -f shell.qml
